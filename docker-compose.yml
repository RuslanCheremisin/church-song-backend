services:

  postgres:

    image: postgres:15

    container_name: postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: church-song
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    ports:

      - "5434:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7

    container_name: redis

    restart: unless-stopped

    ports:

      - "6379:6379"

    volumes:

      - redis_data:/data

  church-song-1:

    build: .

    container_name: church-song-1

    depends_on:

      - postgres
      - redis

    ports:

      - "8081:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/church-song

      SPRING_DATASOURCE_USERNAME: postgres

      SPRING_DATASOURCE_PASSWORD: 123

      SPRING_DATA_REDIS_HOST: redis

      SPRING_DATA_REDIS_PORT: 6379

  church-song-2:

    build: .

    container_name: church-song-2

    depends_on:

      - postgres
      - redis

    ports:

      - "8082:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/church-song

      SPRING_DATASOURCE_USERNAME: postgres

      SPRING_DATASOURCE_PASSWORD: 123

      SPRING_DATA_REDIS_HOST: redis

      SPRING_DATA_REDIS_PORT: 6379

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - church-song-1
      - church-song-2

volumes:

  postgres_data:

  redis_data: